name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned to 24.04 on purpose: ubuntu-latest is moving to 26.04,
    # and the setup-python manifest has no Python 3.8 or 3.9 build
    # for 26.04, so the 3.8 job would fail there with "version not
    # found". 24.04 has builds for the whole 3.8-3.12 matrix.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: pip install -e .
      - run: statecat --version

  test-windows:
    # Same suite on real Windows, because the Ubuntu job above
    # cannot exercise Windows filesystem behaviour at all: the
    # Windows PID guard (never calling os.kill(pid, 0), which
    # would send Ctrl+C there) only has a mocked test on
    # Ubuntu. Deliberately NOT the full 3.8-3.12 matrix:
    # Python 3.8 has no setup-python build on current Windows
    # runners, so this job runs the two newest versions the
    # Ubuntu job already covers, on windows-2022. Untested
    # until Actions runs it: no Windows machine was available
    # when this job was added.
    runs-on: windows-2022
    strategy:
      # A failing matrix job cancels its siblings by default;
      # a 3.12 failure must not cancel the 3.11 run.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: pip install -e .
      - run: statecat --version
